<section class="liste-cours">
    @for (c of cours | filtreCours:recherche| triCours:tri; track c.titre) {
      <article
        class="carte-cours"
        [class.actif]="c === coursActif"
        (click)="selectionner(c)">
        <h2>{{ c.titre }}</h2>
        <p>Catégorie : {{ c.categorie }}</p>
        <p>Durée : {{ c.duree }}</p>
        <p>Places disponibles : {{ c.placesRestantes }}</p>
      </article>
    }@empty {
      <p class="liste-vide">aucun cours ne correspond à la recherche</p>
    }
    <div class="controles">
      <input [(ngModel)]="recherche" placeholder="recherche un cours...">
      <select [(ngModel)]="tri">
        <option value="asc">titre A -> Z</option>
        <option value="desc">titre Z -> A</option>
      </select>
    </div>
</section>
